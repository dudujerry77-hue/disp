<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css"></head>
<body class="admin-shell dashboard"><aside class="sidebar"><a class="brand" href="/admin/dashboard.html"><span class="brand-mark"></span>Admin</a><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/products.html">Products</a><a href="/admin/orders.html">Orders</a><a class="btn" href="/index.html">Visit Home</a><button data-logout>Sign Out</button></aside><main class="main"><h1>Products</h1><section class="panel"><form id="productForm"><input type="hidden" name="product_id"><div class="grid"><label>Name<input name="name" required></label><label>Price<input name="price" type="number" step="0.01" required></label><label>Category<input name="category" required></label><label>Image URL<input name="image_url" type="url" placeholder="Used if no file is uploaded"></label><label>Upload image<input name="image_file" type="file" accept="image/*"></label></div><label>Description<textarea name="description" required></textarea></label><label class="row"><input name="available" type="checkbox" checked> Available</label><button class="btn" type="submit">Save Product</button></form></section><div id="adminProducts" class="stack"></div></main><script type="module" src="/js/admin.js"></script></body></html>
