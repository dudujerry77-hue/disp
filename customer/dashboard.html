<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Dashboard</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/customer.css"></head>
<body class="customer-shell dashboard"><aside class="sidebar"><a class="brand" href="/customer/dashboard.html"><span class="brand-mark"></span>Dispatchly</a><a href="/customer/dashboard.html">Shop</a><a href="/customer/orders.html">Orders</a><button data-logout>Sign Out</button></aside>
